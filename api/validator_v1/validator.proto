syntax = "proto3";

package validator;

option go_package = "github.com/vvvvgross/email-validator/api/validator_v1";

service EmailValidation {
    rpc Validate (ValidateRequest) returns (ValidateResponse) {}
}

message ValidateRequest {
    string email = 1;
}

message ValidateResponse {
    bool is_correct = 1;
    string answer = 2;
}